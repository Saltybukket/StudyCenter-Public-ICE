[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "studycenter-public-ice"
version = "0.1.0b3"
description = "StudyCenter Public ICE: local study organisation with a familiar interface"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "jinja2==3.1.6", "httpx==0.28.1",
  "beautifulsoup4==4.15.0", "pymupdf==1.28.2", "playwright==1.63.0",
  "python-multipart==0.0.32", "portalocker==4.4.0", "tzdata==2026.5",
  "pydantic==2.14.0", "pyjwt[crypto]==2.15.1", "keyring==25.7.0",
  "pystray==0.19.5; sys_platform == 'win32'", "pillow==13.0.0",
  "windows-toasts==1.3.1; sys_platform == 'win32'",
  "pywebview==6.2.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
browser = ["playwright==1.63.0"]
speech = ["faster-whisper==1.2.1", "sherpa-onnx==1.13.8"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "numpy==2.5.4", "av==19.0.1", "faster-whisper==1.2.1"]

[project.scripts]
studycenter-ice = "studycenter_ice.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["studycenter_ice*"]

[tool.setuptools.package-data]
studycenter_ice = ["templates/*.html", "static/*", "static/vendor/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
